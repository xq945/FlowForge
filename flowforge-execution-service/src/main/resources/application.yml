server:
  port: 8086

spring:
  application:
    name: flowforge-execution-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/flowforge_execution?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:flowforge}
    password: ${MYSQL_PASSWORD:flowforge}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 3000
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5674}
    username: ${RABBITMQ_USER:flowforge}
    password: ${RABBITMQ_PASSWORD:flowforge}
    # 发布确认：只有 Broker 明确 ack 且消息没有被退回，才认为真正投递成功
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 手动 ACK：业务处理并提交后才确认
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 2
        max-concurrency: 8
        # 关闭 Spring 内置原地重试，重试统一走延迟队列，避免消息在队列里打转
        retry:
          enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

flowforge:
  security:
    jwt:
      issuer: flowforge
      ttl: 2h
      secret: ${FLOWFORGE_JWT_SECRET:}
  execution:
    retry-scan-interval-ms: 1000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.flowforge: DEBUG
