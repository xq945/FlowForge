# FlowForge 基础环境（阶段二）
#
# 端口刻意避开本机常见默认端口及其它项目占用：MySQL 3307、Redis 6380、RabbitMQ 5674/15674、Nacos 控制台 8849。
# 本地开发时应用跑在 IDE 里，通过 application-local.yml 连接这些映射端口；
# 容器化部署时改用 compose 服务名（见各服务的 application-docker.yml）。
#
# 首次启动会执行 ./mysql/init 下的脚本；修改建表脚本后需要 down -v 重建数据卷才会重新执行。

name: flowforge

services:
  mysql:
    image: mysql:8.0
    container_name: flowforge-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: flowforge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: flowforge
      RABBITMQ_DEFAULT_PASS: flowforge
      TZ: Asia/Shanghai
    ports:
      - "5674:5672"
      - "15674:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: flowforge-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # Nacos 3.x 不再自动创建内置账户，本地开发关闭鉴权以保证开箱可用。
      # 生产环境必须开启 NACOS_AUTH_ENABLE 并单独初始化管理员账户。
      # token 与 identity 即使不启用鉴权也必须提供，否则启动脚本直接退出（exit 255）。
      NACOS_AUTH_ENABLE: "false"
      # NACOS_AUTH_ENABLE 只关掉了 nacos.core.auth.enabled，
      # 3.x 的管理端与控制台是另外两个开关，不关掉发布配置会 403（User not found），
      # 控制台也无法登录。仅本地开发关闭。
      NACOS_AUTH_ADMIN_ENABLE: "false"
      NACOS_AUTH_CONSOLE_ENABLE: "false"
      NACOS_AUTH_TOKEN: "Zmxvd2ZvcmdlLWxvY2FsLW5hY29zLWF1dGgtdG9rZW4tMjAyNi1jaGFuZ2UtbWU="
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "flowforge-local"
      JVM_XMS: 256m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"   # 客户端注册/配置端口（HTTP）
      - "9848:9848"   # gRPC 端口，3.x 客户端必需
      - "8849:8080"   # 3.x 控制台
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      # 3.x 移除了 v1 健康接口，控制台根路径可返回 200，用它判断进程就绪
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # XXL-JOB 调度中心：周期触发的调度与任务管理界面
  # 表结构来自官方 doc/db/tables_xxl_job.sql，已初始化到 xxl_job 库
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: flowforge-xxl-job
    restart: unless-stopped
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=root
        --spring.datasource.password=root
        --xxl.job.accessToken=default_token
      TZ: Asia/Shanghai
    ports:
      - "8090:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # ==================================================================
  # 应用服务（可选）：docker compose --profile app up -d 启动全栈
  # 日常开发只需基础设施，应用在 IDE 里跑，避免每次改代码都重建镜像。
  # ==================================================================

  flowforge-user-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR_FILE: flowforge-user-service/target/flowforge-user-service-0.1.0-SNAPSHOT.jar
    container_name: flowforge-user
    restart: unless-stopped
    environment:
      FLOWFORGE_JWT_SECRET: ${FLOWFORGE_JWT_SECRET:-flowforge-docker-dev-secret-key-0123456789ab}
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }

  flowforge-workflow-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR_FILE: flowforge-workflow-service/target/flowforge-workflow-service-0.1.0-SNAPSHOT.jar
    container_name: flowforge-workflow
    restart: unless-stopped
    environment:
      FLOWFORGE_JWT_SECRET: ${FLOWFORGE_JWT_SECRET:-flowforge-docker-dev-secret-key-0123456789ab}
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }

  flowforge-execution-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR_FILE: flowforge-execution-service/target/flowforge-execution-service-0.1.0-SNAPSHOT.jar
    container_name: flowforge-execution
    restart: unless-stopped
    environment:
      FLOWFORGE_JWT_SECRET: ${FLOWFORGE_JWT_SECRET:-flowforge-docker-dev-secret-key-0123456789ab}
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      nacos: { condition: service_healthy }

  flowforge-scheduler-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR_FILE: flowforge-scheduler-service/target/flowforge-scheduler-service-0.1.0-SNAPSHOT.jar
    container_name: flowforge-scheduler
    restart: unless-stopped
    environment:
      FLOWFORGE_JWT_SECRET: ${FLOWFORGE_JWT_SECRET:-flowforge-docker-dev-secret-key-0123456789ab}
      NACOS_SERVER_ADDR: nacos:8848
      XXL_JOB_ADMIN: http://xxl-job-admin:8080/xxl-job-admin
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
      xxl-job-admin: { condition: service_started }

  flowforge-notification-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR_FILE: flowforge-notification-service/target/flowforge-notification-service-0.1.0-SNAPSHOT.jar
    container_name: flowforge-notification
    restart: unless-stopped
    environment:
      FLOWFORGE_JWT_SECRET: ${FLOWFORGE_JWT_SECRET:-flowforge-docker-dev-secret-key-0123456789ab}
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      nacos: { condition: service_healthy }

  flowforge-gateway:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.service
      args:
        JAR_FILE: flowforge-gateway/target/flowforge-gateway-0.1.0-SNAPSHOT.jar
    container_name: flowforge-gateway
    restart: unless-stopped
    environment:
      FLOWFORGE_JWT_SECRET: ${FLOWFORGE_JWT_SECRET:-flowforge-docker-dev-secret-key-0123456789ab}
      NACOS_SERVER_ADDR: nacos:8848
    depends_on:
      nacos: { condition: service_healthy }
      redis: { condition: service_healthy }

  flowforge-frontend:
    profiles: ["app"]
    build:
      context: ../flowforge-frontend
      dockerfile: Dockerfile
    container_name: flowforge-frontend
    restart: unless-stopped
    ports:
      # 全栈模式只对外暴露前端；接口经 Nginx 反代到网关，与生产拓扑一致
      - "8088:80"
    depends_on:
      flowforge-gateway: { condition: service_started }

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
