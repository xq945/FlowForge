server:
  port: 8085

spring:
  config:
    import:
      - optional:nacos:flowforge-common.yaml?group=FLOWFORGE&refreshEnabled=true&preference=remote
      - optional:nacos:flowforge-scheduler-service.yaml?group=FLOWFORGE&refreshEnabled=true&preference=remote
  application:
    name: flowforge-scheduler-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/flowforge_scheduler?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:flowforge}
    password: ${MYSQL_PASSWORD:flowforge}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  cloud:
    nacos:
      config:
        # 前缀必须是 spring.cloud.nacos：starter 里的 NacosPropertiesPrefixProvider
        # 返回的就是它，写成 spring.nacos 不会生效
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        # 本地 Nacos 关闭了鉴权，留空即不登录；开启鉴权的环境用环境变量注入
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    openfeign:
      client:
        config:
          default:
            # 同步调用只用于读快照与创建实例，超时必须短：网关与上游都在等这个结果
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

resilience4j:
  circuitbreaker:
    instances:
      workflowService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      executionService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8090/xxl-job-admin}
    # 与调度中心配置的 accessToken 保持一致，否则执行器注册会被拒绝
    accessToken: ${XXL_JOB_TOKEN:default_token}
    executor:
      appname: flowforge-scheduler
      port: 9999
      logpath: ./logs/xxl-job
      logretentiondays: 7

flowforge:
  security:
    jwt:
      issuer: flowforge
      ttl: 2h
      secret: ${FLOWFORGE_JWT_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.flowforge: DEBUG
