server:
  port: 8087

spring:
  config:
    import:
      - optional:nacos:flowforge-common.yaml?group=FLOWFORGE&refreshEnabled=true&preference=remote
      - optional:nacos:flowforge-notification-service.yaml?group=FLOWFORGE&refreshEnabled=true&preference=remote
  application:
    name: flowforge-notification-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/flowforge_notification?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:flowforge}
    password: ${MYSQL_PASSWORD:flowforge}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  cloud:
    nacos:
      config:
        # 前缀必须是 spring.cloud.nacos：starter 里的 NacosPropertiesPrefixProvider
        # 返回的就是它，写成 spring.nacos 不会生效
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        # 本地 Nacos 关闭了鉴权，留空即不登录；开启鉴权的环境用环境变量注入
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5674}
    username: ${RABBITMQ_USER:flowforge}
    password: ${RABBITMQ_PASSWORD:flowforge}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

flowforge:
  security:
    jwt:
      issuer: flowforge
      ttl: 2h
      secret: ${FLOWFORGE_JWT_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.flowforge: DEBUG
