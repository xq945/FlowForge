# 容器内运行：通过 compose 服务名访问基础设施
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/flowforge_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
  data:
    redis:
      host: redis
      port: 6379

flowforge:
  security:
    jwt:
      secret: ${FLOWFORGE_JWT_SECRET}
